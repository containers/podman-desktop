name: PD E2E Testing Farm

run-name: >-
  ${{ inputs.release_tag
      && format('PD E2E Testing Farm [{0}]', inputs.release_tag)
      || github.workflow }}

on:
  schedule:
    - cron:  '0 0 * * *'
    
  workflow_dispatch:
    inputs:
      podman_version:
        default: 'latest'
        description: 'Podman version to install (e.g., "5.5.2", "5.6.0~rc1"). Use "latest" for stable, "nightly" for the latest development build, or "podman6" for the f44-podman6 COPR build (Fedora 44 only).'
        type: string
        required: true
      npm_target:
        description: 'TMT plan target to run (e.g. smoke, e2e, kubernetes, all)'
        type: string
        default: 'e2e'
      branch:
        default: 'main'
        description: 'Podman Desktop repo branch'
        type: string
        required: false
      release_tag:
        description: 'Tag to identify this run for report-portal'
        type: string
        default: ''
        required: false

permissions:
  contents: read

jobs:
  pd-e2e-testing-farm-ci:
    permissions:
      contents: read
      checks: write
    timeout-minutes: 90
    name: pd-e2e-testing-farm-ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: ['Fedora']
        os-version: ['43', '44']
    steps:
      - name: Set the default env. variables
        env:
          DEFAULT_NPM_TARGET: 'all'
          DEFAULT_PODMAN_VERSION: 'latest'
          DEFAULT_NODE_VERSION: 'v24.15.0'
        run: |
          echo "NPM_TARGET=${{ github.event.inputs.npm_target || env.DEFAULT_NPM_TARGET }}" >> $GITHUB_ENV
          echo "PODMAN_VERSION=${{ github.event.inputs.podman_version || env.DEFAULT_PODMAN_VERSION }}" >> $GITHUB_ENV
          echo "NODE_VERSION=${{ env.DEFAULT_NODE_VERSION }}" >> $GITHUB_ENV

      - name: Run Podman Desktop Playwright E2E tests on Testing Farm CI
        id: run-e2e-tf
        uses: sclorg/testing-farm-as-github-action@230555baceb860aa468d216f1822974836b965d1
        with:
          api_key: ${{ secrets.TF_TOKEN }}
          git_ref: ${{ github.event.inputs.branch || github.ref_name }}
          create_github_summary: "false"
          compose: ${{ matrix.os }}-${{ matrix.os-version }}
          tmt_plan_filter: 'name:/tests/tmt/plans/pd-e2e-plan/${{ env.NPM_TARGET }}'
          variables: COMPOSE=${{ matrix.os }}-${{ matrix.os-version }};ARCH=x86_64;PODMAN_VERSION=${{ env.PODMAN_VERSION }};NODE_VERSION=${{ env.NODE_VERSION }}

      - name: Extract Testing Farm work ID and base URL
        if: always()
        run: |
          TF_ARTIFACTS_URL="${{ steps.run-e2e-tf.outputs.test_log_url }}"
          TF_DEFAULT_JUNIT_DEFAULT="${TF_ARTIFACTS_URL}/results-junit.xml"
          curl -o results-junit.xml "$TF_DEFAULT_JUNIT_DEFAULT"

          TF_WORK_ID=$(grep -o 'work-${{ env.NPM_TARGET }}[^/"]*' results-junit.xml | head -1)

          echo "TF_WORK_ID=$TF_WORK_ID" >> $GITHUB_ENV
          echo "TF_ARTIFACTS_URL=$TF_ARTIFACTS_URL" >> $GITHUB_ENV

      - name: Download Playwright JUnit report from Testing Farm
        if: always()
        run: |
          TF_PLAYWRIGHT_JUNIT_URL="${{ env.TF_ARTIFACTS_URL }}/${{ env.TF_WORK_ID }}/tests/tmt/plans/pd-e2e-plan/${{ env.NPM_TARGET }}/execute/data/guest/default-0/tests/tmt/tests/${{ env.NPM_TARGET }}-test-1/data/junit-results.xml"
          curl -o junit-playwright-results.xml "$TF_PLAYWRIGHT_JUNIT_URL"

      - name: Publish test report to PR
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d
        with:
          fail_on_failure: true
          include_passed: true
          detailed_summary: true
          annotate_only: true
          require_tests: true
          report_paths: '**/junit-playwright-results.xml'

      - name: Download test artifacts from Testing Farm
        if: failure()
        run: |
          mkdir -p results

          TF_TEST_DATA_URL="${{ env.TF_ARTIFACTS_URL }}/${{ env.TF_WORK_ID }}/tests/tmt/plans/pd-e2e-plan/${{ env.NPM_TARGET }}/execute/data/guest/default-0/tests/tmt/tests/${{ env.NPM_TARGET }}-test-1/data"
          TF_TRACES_URL="${TF_TEST_DATA_URL}/traces/"
          TF_VIDEOS_URL="${TF_TEST_DATA_URL}/videos/"

          echo "Downloading traces"
          wget \
            --recursive \
            --no-parent \
            --no-host-directories \
            --cut-dirs=10 \
            --reject "index.html*" \
            --directory-prefix=results \
            "$TF_TRACES_URL"

          echo "Downloading videos"
          wget \
            --recursive \
            --no-parent \
            --no-host-directories \
            --cut-dirs=10 \
            --reject "index.html*" \
            --directory-prefix=results \
            "$TF_VIDEOS_URL"

      - name: Create json file with workflow run attributes
        if: always()
        uses: podman-desktop/e2e/.github/actions/generate-test-attributes@053dd9e2e4511c412dcaa835d884eec303797ed6
        with:
          filename: workflow-run-attributes.json
          runs-on-gh-runner: false
          os: ${{ matrix.os }}
          os-version: ${{ matrix.os-version }}
          architecture: x86_64
          podman-version: ${{ env.PODMAN_VERSION }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testing-farm-artifacts-${{ matrix.os }}-${{ matrix.os-version }}
          path: |
            results/*
            **/junit-playwright-results.xml
            **/workflow-run-attributes.json
