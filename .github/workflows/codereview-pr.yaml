# Untrusted half of the AI code review: builds the PR checkout as artifacts, with no secrets.
# The review itself runs in review-processing/review (see codereview-dispatch.yaml).

name: codereview-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  build:
    if: github.event.repository.fork == false
    uses: review-processing/actions/.github/workflows/pr.yaml@97ec74d7dd995ae960d98c70420018ac4da0015d # main
    permissions:
      pull-requests: read
