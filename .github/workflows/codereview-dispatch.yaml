# Hands a successful codereview-pr build over to review-processing/review, which reviews it
# and comments on the PR. workflow_run runs this file from the default branch only.

name: codereview-dispatch

on:
  workflow_run:
    workflows: [codereview-pr]
    types: [completed]

permissions: {}

jobs:
  dispatch:
    if: ${{ github.event.repository.fork == false && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    uses: review-processing/actions/.github/workflows/dispatch.yaml@97ec74d7dd995ae960d98c70420018ac4da0015d # main
    permissions:
      actions: read
      pull-requests: read
    secrets:
      dispatch-token: ${{ secrets.REVIEW_DISPATCH_TOKEN }}
