name: Visual Testing

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'storybook/**'
      - 'website/**'
      - 'website-argos/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/argos-website.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'storybook/**'
      - 'website/**'
      - 'website-argos/**'

permissions:
  contents: read

jobs:
  website:
    name: website
    permissions:
      # Required to check out the repository and read its metadata
      contents: read
      # Required for Argos to authenticate via OIDC
      id-token: write
    runs-on: ubuntu-22.04
    # disable on forks as secrets are not available
    if: github.event.repository.fork == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Execute pnpm
        run: pnpm install

      - name: Run website
        run: pnpm website:build

      - name: Install Playwright browsers
        working-directory: website-argos
        run: pnpm playwright install --with-deps chromium

      - name: Take screenshots with Playwright
        run: pnpm website:screenshots

      - name: Upload screenshots to Argos
        continue-on-error: true
        working-directory: website-argos
        run: pnpm upload
