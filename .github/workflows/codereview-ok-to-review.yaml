# `/ok-to-review <sha>` from a maintainer approves the AI code review of that commit
# of an external contributor's PR.

name: codereview-ok-to-review

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  ok-to-review:
    if: ${{ github.event.repository.fork == false && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ok-to-review ') }}
    uses: review-processing/actions/.github/workflows/ok-to-review.yaml@97ec74d7dd995ae960d98c70420018ac4da0015d # main
    permissions:
      actions: write
      pull-requests: write
